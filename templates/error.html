{% extends "base.html" %}
{% block title %}{{ titulo }}{% endblock %}
{% block body %}
<div class="error-page" style="padding:24px">
  <div>
    <div class="fallen" aria-hidden="true">
      <div style="height:84px;background:#1F6F78"></div>
      <div style="height:96px;background:#A86E12"></div>
      <div style="height:70px;background:#3B4DA8;transform:rotate(-24deg) translate(-8px, 8px);transform-origin:bottom left"></div>
      <div style="height:60px;background:#7A4E9E;transform:rotate(72deg) translate(30px, 10px);transform-origin:bottom left;opacity:.9"></div>
    </div>
    <h1>{{ titulo }}</h1>
    <p>{{ detalle }}</p>
    <a class="btn pri" href="{{ url_for('inicio') }}"><i data-lucide="house"></i>Volver al inicio</a>
  </div>
</div>
{% endblock %}
